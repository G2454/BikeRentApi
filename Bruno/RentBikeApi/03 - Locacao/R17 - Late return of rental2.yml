info:
  name: R17 - Late return of rental2
  type: http
  seq: 20

http:
  method: PUT
  url: "{{baseUrl}}/locacao/{{rental2Id}}/devolucao"
  body:
    type: json
    data: |-
      {
        "data_devolucao": "{{lateReturn15}}T00:00:00Z"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.mensagem
      operator: eq
      value: '"Data de devolução informada com sucesso"'