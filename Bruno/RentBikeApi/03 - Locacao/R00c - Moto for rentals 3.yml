info:
  name: R00c - Moto for rentals 3
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/motos"
  body:
    type: json
    data: |-
      {
        "identificador": "{{rentMoto3Id}}",
        "ano": 2023,
        "modelo": "Sport",
        "placa": "{{rentMoto3Plate}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"