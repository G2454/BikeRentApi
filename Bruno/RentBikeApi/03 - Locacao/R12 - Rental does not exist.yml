info:
  name: R12 - Rental does not exist
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/locacao/does-not-exist-{{run}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.mensagem
      operator: eq
      value: '"Locação não encontrada"'