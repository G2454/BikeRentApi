info:
  name: R07 - Renting for another courier
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/locacao"
  body:
    type: json
    data: |-
      {
        "entregador_id": "does-not-exist-{{run}}",
        "moto_id": "{{rentMoto3Id}}",
        "plano": 7
      }
  auth:
    type: bearer
    token: "{{courierA3Token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"
    - expression: res.body.mensagem
      operator: eq
      value: '"Acesso negado"'

docs: 'Courier A3 tries to rent for another courier id. The token says who you are, so the API refuses with 403 before checking anything else.'
