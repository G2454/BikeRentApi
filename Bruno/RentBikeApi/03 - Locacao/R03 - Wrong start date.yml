info:
  name: R03 - Wrong start date
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/locacao"
  body:
    type: json
    data: |-
      {
        "entregador_id": "{{courierA3Id}}",
        "moto_id": "{{rentMoto3Id}}",
        "data_inicio": "{{today}}T00:00:00Z",
        "plano": 7
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.mensagem
      operator: eq
      value: '"Dados inválidos"'