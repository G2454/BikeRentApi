info:
  name: M05 - Filter by plate
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/motos?placa={{motoPlate}}"
  params:
    - name: placa
      value: "{{motoPlate}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("returns exactly the filtered moto", () => {
          expect(res.body).to.have.lengthOf(1);
          expect(res.body[0].placa).to.equal(bru.getVar("motoPlate"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
