info:
  name: M15 - Delete moto without rentals
  type: http
  seq: 15

http:
  method: DELETE
  url: "{{baseUrl}}/motos/{{motoId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
