info:
  name: M02 - Duplicate plate
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/motos"
  body:
    type: json
    data: |-
      {
        "identificador": "moto-dup-{{run}}",
        "ano": 2021,
        "modelo": "Sport",
        "placa": "{{motoPlate}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.mensagem
      operator: eq
      value: '"Dados inválidos"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
