info:
  name: M09 - Change to a plate already in use
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/motos/{{motoId}}/placa"
  body:
    type: json
    data: |-
      {
        "placa": "{{motoPlateNew}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.mensagem
      operator: eq
      value: '"Dados inválidos"'