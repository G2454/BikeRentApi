info:
  name: M11 - Empty body
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/motos"
  body:
    type: json
    data: "{ }"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.mensagem
      operator: eq
      value: '"Dados inválidos"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
