info:
  name: M10 - Plate was really changed
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/motos/{{motoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("has the new plate", () => {
          expect(res.body.placa).to.equal(bru.getVar("motoPlateNew"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
