info:
  name: M12 - Empty strings and year 0
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/motos"
  body:
    type: json
    data: |-
      {
        "identificador": "",
        "ano": 0,
        "modelo": "",
        "placa": ""
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.mensagem
      operator: eq
      value: '"Dados inválidos"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
