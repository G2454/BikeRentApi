info:
  name: M16 - Deleted moto is gone
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/motos/{{motoId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.mensagem
      operator: eq
      value: '"Dados inválidos"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
