info:
  name: M07 - Moto not found
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/motos/does-not-exist-{{run}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.mensagem
      operator: eq
      value: '"Moto não encontrada"'