info:
  name: C16 - Upload invalid base64
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/entregadores/{{courierAId}}/cnh"
  body:
    type: json
    data: |-
      {
        "imagem_cnh": "this is not base64!!"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.mensagem
      operator: eq
      value: '"Dados inválidos"'