info:
  name: C08 - CNH with 10 digits
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/entregadores"
  body:
    type: json
    data: |-
      {
        "identificador": "courier-bad-cnh-{{run}}",
        "nome": "Bad CNH",
        "cnpj": "{{spareCnpj}}",
        "data_nascimento": "1990-01-01T00:00:00Z",
        "numero_cnh": "1234567890",
        "tipo_cnh": "A"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.mensagem
      operator: eq
      value: '"Dados inválidos"'