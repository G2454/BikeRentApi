info:
  name: C05 - Same CNPJ formatted is a duplicate
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/entregadores"
  body:
    type: json
    data: |-
      {
        "identificador": "courier-dup-cnpj-{{run}}",
        "nome": "Duplicate CNPJ",
        "cnpj": "{{courierACnpjFormatted}}",
        "data_nascimento": "1990-01-01T00:00:00Z",
        "numero_cnh": "1{{run}}0005",
        "tipo_cnh": "A"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.mensagem
      operator: eq
      value: '"Dados inválidos"'

docs: |-
  Sends courier A's CNPJ formatted (12.345.678/0001-95).
  The API normalizes it before checking uniqueness, so it must be rejected as a duplicate.